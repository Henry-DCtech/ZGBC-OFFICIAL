{% extends 'base.html' %}
{% block content %}
<div class="card">
    {% if event.image %}
    <img src="{{ event.image.url }}" class="card-img-top" alt="{{ event.title }}">
    {% endif %}
    <div class="card-body">
        <h2>{{ event.title }}</h2>
        <p class="text-muted">{{ event.date|date:"F d, Y H:i" }} | {{ event.location }}</p>
        <p>{{ event.description }}</p>
    </div>
</div>
{% endblock %}
