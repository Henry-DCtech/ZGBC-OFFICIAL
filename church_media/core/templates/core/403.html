{% extends 'base.html' %}
{% block title %}403 - Permission Denied{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <h1 class="display-1 text-danger">403</h1>
    <h2 class="mb-4">Permission Denied</h2>
    <p class="lead">Sorry, only church staff can add events and programs.</p>
    <p>If you think this is a mistake, please contact the admin.</p>
    
    <div class="mt-4">
        <a href="{% url 'core:home' %}" class="btn btn-primary">Go Home</a>
        <a href="{% url 'admin:login' %}?next={{ request.path }}" class="btn btn-outline-secondary">Login as Staff</a>
    </div>
</div>
{% endblock %}
