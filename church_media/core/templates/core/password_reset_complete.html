{% extends 'core/base.html' %}

{% block title %}Password Changed - ZGBC{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body p-4 text-center">
                    <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                    <h2>Password Changed</h2>
                    <p class="text-muted">Your password has been set. You can now log in with your new password.</p>
                    <a href="{% url 'core:landing' %}" class="btn btn-primary mt-3">Log In Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
