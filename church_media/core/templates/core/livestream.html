{% extends 'base.html' %}

{% block title %}Live - ZGBC Media Centre{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="display-4 text-center mb-4">Live Stream</h1>
    <p class="lead text-center mb-5">Join us live every Sunday at 8:00 AM</p>
    
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="ratio ratio-16x9">
                <iframe src="https://www.youtube.com/embed/live_stream?channel=@ziongbctv" 
                        title="ZGBC Live Stream" 
                        allowfullscreen></iframe>
            </div>
        </div>
    </div>
    
    <div class="text-center mt-4">
        <p class="text-muted">Stream offline? Check our <a href="{% url 'core:sermons' %}">recent sermons</a>.</p>
    </div>
</div>


<div class="container">
    <h1>Latest Sermons</h1>
    <p>Sermon list will go here</p>
</div>

{% endblock %}
